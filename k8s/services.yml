apiVersion: v1
kind: Service
metadata:
  name: ticket-booking-db
spec:
  selector:
    app: ticket-booking-db
  ports:
    - port: 5432
      protocol: TCP
      targetPort: 5432
      nodePort: 30010
  type: NodePort
