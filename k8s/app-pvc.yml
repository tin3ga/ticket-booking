apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ticket-booking
spec:
  resources:
    requests:
      storage: 1Gi
  accessModes:
    - ReadWriteMany
  volumeName: ticket-booking

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ticket-booking-db
spec:
  resources:
    requests:
      storage: 1Gi
  accessModes:
    - ReadWriteMany
  volumeName: ticket-booking-db
